<script>
const API = location.origin;

function setToken() {
    const token = document.getElementById("token").value;
    localStorage.setItem("admin_token", token);
    alert("Token enregistré");
}

function authFetch(url) {
    const token = localStorage.getItem("admin_token");
    return fetch(API + url, {
        headers: {
            "Authorization": "Bearer " + token
        }
    });
}

function enableMaintenance(code) {
    authFetch(`/api/admin/set?code=${code}`)
        .then(r => r.json())
        .then(console.log);
}

function disableMaintenance() {
    authFetch(`/api/admin/disable`)
        .then(r => r.json())
        .then(console.log);
}
</script>

<input id="token" placeholder="Admin token">
<button onclick="setToken()">Sauvegarder</button>

<hr>

<button onclick="enableMaintenance(503)">Maintenance ON</button>
<button onclick="disableMaintenance()">Maintenance OFF</button>
