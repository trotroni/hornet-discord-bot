<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dashboard Bot</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Dashboard Bot & Serveur</h1>

<div id="status">
    <strong>Status:</strong>

    <div>CPU Temp: <span id="cpu-temp">--</span> °C</div>
    <div>CPU: <span id="cpu-perc">--</span> %</div>
    <div>RAM: <span id="ram-perc">--</span> %</div>

    <br>

    <div>Bots:</div>
    <div>Core: <span id="bot-core">--</span></div>
    <div>Compta: <span id="bot-compta">--</span></div>
    <div>Server: <span id="bot-server">--</span></div>
</div>

<div id="logs-buttons">
    <button data-type="nude-core-bot">Core</button>
    <button data-type="nude-compta-bot">Compta</button>
    <button data-type="server">Server</button>
</div>

<div id="logs-container"></div>

<!-- GRILLE 2x2 -->
<div id="dashboard-grid">
    <canvas id="cpuChart"></canvas>
    <canvas id="ramChart"></canvas>
    <canvas id="logsBarChart"></canvas>
    <canvas id="cpuTempChart"></canvas>
</div>

<div id="commands">
    <button onclick="sendCommand('raspberry')">Redémarrer Raspberry</button>
    <button onclick="refreshDashboard()">Rafraîchir</button>
</div>

<pre id="log-viewer"></pre>

<script src="script.js"></script>
</body>
</html>
