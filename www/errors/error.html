<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Erreur {{code}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: #e0e0e0;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .box {
            text-align: center;
            max-width: 520px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        p {
            opacity: 0.75;
        }

        .code {
            opacity: 0.5;
            margin-top: 10px;
        }

        button {
            margin-top: 25px;
            padding: 10px 18px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            cursor: pointer;
        }

        button:hover {
            background: #262626;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Erreur {{code}}</h1>
    <p>{{message}}</p>
    <div class="code">Une erreur serveur est survenue.</div>
    <button onclick="goHome()">Retour</button>
</div>

<script src="error.js"></script>
</body>
</html>
